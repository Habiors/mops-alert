name: MOPS Alert daily watch

on:
  schedule:
    # Six checks a day, weekdays, Taipei time - raised from once-daily
    # 2026-08-16 per Charles ("那提高抓取頻率 在14:00, 15:00, 16:00, 17:00,
    # 18:00, 21:30 各抓一次 並即時更新，保留當日的重大訊息"). The live MOPS
    # endpoint only returns a capped rolling window of recent disclosures
    # market-wide (confirmed: raising the row count via any guessed
    # parameter didn't work), so a single evening check could miss something
    # filed earlier in the day if it aged out of that window - polling more
    # often, combined with state/ accumulation in mops_watch.py, fixes that.
    # No DST in Taiwan, so these UTC offsets are stable year-round.
    #
    # Shifted 4 min earlier than the original on-the-hour slots 2026-08-17
    # per Charles. Note this does NOT compensate for GitHub's own schedule-
    # trigger delay (observed up to ~36 min on this repo on 2026-08-17,
    # unrelated to the cron time chosen) - it's just a 4-minute offset from
    # the previous :00/:30 slots.
    - cron: "56 5 * * 1-5"   # 13:56 Taipei
    - cron: "56 6 * * 1-5"   # 14:56 Taipei
    - cron: "56 7 * * 1-5"   # 15:56 Taipei
    - cron: "56 8 * * 1-5"   # 16:56 Taipei
    - cron: "56 9 * * 1-5"   # 17:56 Taipei
    - cron: "26 13 * * 1-5"  # 21:26 Taipei
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python3 mops_watch.py

      # Persist state/<date>.json back to the repo so the NEXT run (which
      # starts on a fresh VM with no memory of this one) can carry forward
      # today's already-found matches instead of starting from scratch.
      # Skips cleanly if nothing changed (e.g. this run found nothing new).
      - name: Commit accumulated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "Update MOPS alert state ($(date -u +%Y-%m-%dT%H:%M:%SZ) UTC)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - uses: actions/deploy-pages@v4
